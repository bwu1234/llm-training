[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "llm-training"
version = "0.1.0"
description = "Reproducible GPT training using implementations from LLMs-from-scratch"
readme = "README.md"
requires-python = ">=3.14.9,<3.15"
# Upstream code ships under both repositories' licenses. LLMs-from-scratch's is Apache 2.0
# with its definition of "Source" narrowed to exclude the books, so it is not plain SPDX Apache-2.0.
license = "LicenseRef-LLMs-from-scratch AND Apache-2.0"
license-files = ["LICENSES/*.txt"]
dependencies = [
    "torch>=2.9,<3",
    "tiktoken>=0.12,<1",
    "tokenizers>=0.23,<1",
    "numpy>=2.3,<3",
    "pyyaml>=6,<7",
    "sympy>=1.14,<2",
]

[project.scripts]
llm-training = "llm_training.cli:main"

[dependency-groups]
dev = ["pytest>=9,<10", "ruff>=0.14,<1", "build>=1.3,<2"]
oracle = [
    "transformers>=5.20.2,<6",
]

[tool.hatch.build.targets.wheel]
packages = ["src/llm_training"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
