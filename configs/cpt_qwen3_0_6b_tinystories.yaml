# PLUMBING TEST for continued pretraining: Qwen3-0.6B base trained further on TinyStories,
# tokenized with Qwen3's tokenizer into uint32 files (its 151,936-token vocabulary does not fit
# uint16). The same caveat as configs/cpt_gpt2_small_tinystories.yaml applies: a long run on
# children's stories would erode the base model's skills; register a domain corpus, mix in
# general text, and track the old domain's loss before running for real.
#
# Provisional values (no book recipe): peak lr 3e-5 with cosine decay to 3e-6, nanoGPT's
# optimizer settings, a separate (untied) output head as chapters 6 and 8 train it, and a
# 100-update budget (3.3M tokens) sized for a check.
#
#   uv run llm-training prepare --config configs/cpt_qwen3_0_6b_tinystories.yaml
#   uv run llm-training train --config configs/cpt_qwen3_0_6b_tinystories.yaml
# `prepare` tokenizes the 1.9 GB TinyStories text again (~2 min, ~1.8 GB of uint32 tokens);
# copy or clone data/tinystories/raw into data/tinystories-qwen3/raw first to skip the
# download.
model:
  arch: qwen3
  init_from: qwen3-0.6b-base
  weights_dir: ../data/qwen3-0.6b-base
  tie_embeddings: false
  attn_impl: sdpa
data:
  format: tokens
  corpus: tinystories
  path: ../data/tinystories-qwen3
  tokenizer_cache: ../data/qwen3-0.6b-base
  max_length: 1024
training:
  seed: 1337
  batch_size: 2  # micro-batches of 4 peaked at 47 GB of MPS memory on a 64 GB M2 Max
  grad_accum_steps: 16  # 2 x 1024 x 16 = 32,768 tokens per update
  num_epochs: 1
  max_steps: 100
  learning_rate: 0.00003
  min_lr: 0.000003
  lr_schedule: cosine
  warmup_steps: 10
  beta1: 0.9
  beta2: 0.95
  weight_decay: 0.1
  weight_decay_policy: matrices
  grad_clip: 1.0
  eval_freq: 25
  eval_iter: 20
  recipe: validation_only
  checkpoint_every: 25
runtime:
  device: mps
  num_threads: 4
output:
  root: ../runs/cpt
  prompt: Once upon a time
  sample_tokens: 60
  temperature: 0.8
  top_k: 50
  sample_every: 25
