# GRPO (no KL term) fine-tuning of Qwen3-0.6B base on MATH, as in chapter 6 of *Build a
# Reasoning Model (From Scratch)*: the run behind its 47.4% MATH-500 result
# (`rlvr_grpo_original_no_kl.py --num_rollouts 8 --steps 100 --max_new_tokens 512`, scored at
# step 50). Differences from upstream: float32 embedding/linear weights and AdamW state
# (upstream: bfloat16) and SDPA attention. See docs/grpo.md.
model:
  weights: ../data/qwen3-0.6b-base
  tie_embeddings: false
  attn_impl: sdpa
data:
  path: ../data/math
training:
  seed: 42
  steps: 100
  num_rollouts: 8
  max_new_tokens: 512
  temperature: 0.8
  top_p: 0.9
  learning_rate: 1.0e-5
  weight_decay: 0.01
  grad_clip: 1.0
  skip_zero_advantage_updates: false
  checkpoint_every: 10
  snapshot_every: 10
  grade_timeout: 30.0
runtime:
  device: mps
output:
  root: ../runs/grpo
