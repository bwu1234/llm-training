name: checks
on: [push, pull_request]
jobs:
  cpu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv python install 3.14.9
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run llm-training prepare --config configs/smoke.yaml
      - run: uv run pytest -q
        env:
          LLM_TEST_TOKENIZER_CACHE: ${{ github.workspace }}/data/tokenizer
      - run: uv build
      - run: uv pip install --reinstall --no-deps dist/*.whl
      - name: Import installed wheel outside checkout
        working-directory: /tmp
        run: '"$GITHUB_WORKSPACE/.venv/bin/llm-training" inspect'
  # Publishes the architecture explorer. It runs only after the checks pass, so a stale
  # spec.js (which fails tests/unit/test_explain.py) never ships.
  pages:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: cpu
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - name: Assemble the site
        run: |
          mkdir -p _site
          cp docs/architecture/index.html docs/architecture/spec.js _site/
          cp -R LICENSES _site/LICENSES
          printf 'window.SOURCE_ROOT = "%s";\n' \
            "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/blob/$GITHUB_SHA/" > _site/site.js
          # Pages lets browsers cache each file for 10 minutes. A per-commit URL keeps a new
          # index.html from running against a cached spec.js from the previous deploy.
          sed -i -e "s#src=\"spec.js\"#src=\"spec.js?v=$GITHUB_SHA\"#" \
                 -e "s#src=\"site.js\"#src=\"site.js?v=$GITHUB_SHA\"#" _site/index.html
          test "$(grep -c "?v=$GITHUB_SHA" _site/index.html)" -eq 2
      - uses: actions/upload-pages-artifact@v5
      - id: deploy
        uses: actions/deploy-pages@v5
